# portal/portals.yml — Weekly Playwright portal scan configuration
#
# Priority order (per project direction, June 2026):
#   1. Naukri, Instahyre, Wellfound India — underrepresented in the daily
#      API sourcing (Google Jobs + TheirStack), so the weekly deep scan
#      exists specifically to fill that gap.
#   2. ATS ID company boards (Greenhouse / Lever / Ashby) — same approach
#      Career-Ops used, trimmed to companies that actually hire backend
#      interns/new-grads in India.
#   3. LinkedIn — demoted to optional. The daily pipeline already has a
#      LinkedIn source (linkedin_bridge.js); re-scanning it weekly via
#      Playwright adds ban risk for little incremental signal, so it is
#      disabled by default. Flip `enabled: true` if you want it anyway.
#
# Each entry:
#   name            display name, used as the `source` field on scraped jobs
#   engine          one of: naukri | instahyre | wellfound | greenhouse |
#                   lever | ashby | linkedin
#   url             search URL (search engines) or board URL (ATS engines)
#   company         only used by greenhouse/lever/ashby — the board slug
#   enabled         set false to skip without deleting the config
#   requires_auth   true → scan.mjs skips it and flags via Telegram with
#                   the direct link instead of attempting to scrape

search_portals:
  - name: "Naukri"
    engine: naukri
    enabled: true
    requires_auth: false
    # Naukri's own query syntax: keyword, location as URL segments.
    url: "https://www.naukri.com/backend-developer-jobs-in-bangalore-hyderabad-pune-chennai?experience=0"

  - name: "Naukri (Java/Spring Boot)"
    engine: naukri
    enabled: true
    requires_auth: false
    url: "https://www.naukri.com/java-spring-boot-jobs-in-bangalore-hyderabad-pune-chennai?experience=0"

  - name: "Wellfound India"
    engine: wellfound
    enabled: true
    requires_auth: false
    url: "https://wellfound.com/jobs?locations=India"

  - name: "Wellfound India (Internships)"
    engine: wellfound
    enabled: true
    requires_auth: false
    url: "https://wellfound.com/jobs?job_types=internship&locations=India"

  # DISABLED 2026-09-25 by user: Cloudflare/auth wall makes unattended Indeed
  # applications unreliable. Existing rows remain available for manual review.
  - name: "Indeed India"
    engine: indeed
    enabled: false
    requires_auth: false
    url: "https://in.indeed.com/jobs?q=backend+developer+intern&l=India&fromage=7&sort=date"

  # DISABLED 2026-10-01: Glassdoor throttles automated clients. Verified in a
  # real Edge session with a saved profile, the same board answered three
  # different ways within a few minutes:
  #   plain HTTPS GET           -> HTTP 403
  #   headed browser, 1st load  -> HTTP 200, 234 anchors, ZERO job cards
  #   headed browser, same URL  -> HTTP 404
  # Their listing BFF answers 403 as well
  # (POST /job-search-next/bff/userProfileQuery), so the cards never render
  # even when the page itself loads. The anchors that do appear are
  # related-search sidebar links, not listings - a selector change would have
  # produced the same empty result.
  # It contributed 25 rows and has never produced a single outcome. Leaving it
  # enabled made the pipeline look busier than it was, which is worse than an
  # honest absence. Re-enable only if a Glassdoor partner/API feed is available;
  # do not attempt to defeat the throttling.
  - name: "Glassdoor India"
    engine: glassdoor
    enabled: false
    requires_auth: false
    url: "https://www.glassdoor.co.in/Job/india-backend-developer-intern-jobs-SRCH_KO0,27.htm"

  # RE-ENABLED 2026-10-01. Job Hai was never down: the configured URL was
  # wrong. "/jobs/backend-developer-jobs" returns a real HTTP 404 ("Oops!
  # Page Not Found"), which is indistinguishable from a dead board, so it
  # was disabled on 2026-09-23 as "server unreachable". Verified in a live
  # browser session: https://www.jobhai.com/jobs returns 200 with live
  # listing slugs such as
  #   /it-software-data-analyst-software-developer-application-developer-job-in-nexus-engiconsults-private-limited-...
  # "?search=backend" is accepted (the pagination keeps the parameter) but
  # the result set is not filtered server-side, so scan the index and let the
  # role filter decide, exactly as with every other unfiltered portal.
  - name: "Job Hai"
    engine: jobhai
    enabled: true
    requires_auth: false
    url: "https://www.jobhai.com/jobs"

  # 2026-10-01: requires_auth was TRUE and ENGINES had no instahyre entry at all,
  # so this portal was configured with a scraper that did not exist and could
  # never return a row. Verified live: it serves listings anonymously -
  # "Showing 1 - 20 out of 12898 active jobs" - so no session is needed.
  # Listing URLs are /job-<id>-<slug> at the site root; the /jobs/... shape 404s.
  - name: "Instahyre"
    engine: instahyre
    enabled: true
    requires_auth: false
    url: "https://www.instahyre.com/search-jobs/?function=Engineering&q=backend+intern"

  # ADDED 2026-10-01. Hirist is one of the larger Indian tech job portals and it
  # was simply absent. Verified in a live session: the category index renders
  # real listings server-side-first and reports its own totals -
  #   "Backend Development Jobs, 4179 Job Vacancies"
  # Listings are /j/<company>-<title>-<id>; the category and skill nav is
  # /c/<category>-jobs and /k/<skill>-jobs, which the scraper excludes so nav
  # links are not mistaken for jobs.
  - name: "Hirist (Backend Development)"
    engine: hirist
    enabled: true
    requires_auth: false
    url: "https://www.hirist.com/c/backend-development-jobs"

  - name: "Hirist (Java)"
    engine: hirist
    enabled: true
    requires_auth: false
    url: "https://www.hirist.com/k/java-jobs"

  - name: "YC Combinator (Work at a Startup)"
    engine: yc
    enabled: true
    requires_auth: false
    url: "https://www.workatastartup.com/jobs?role=backend&type=intern"

  - name: "LinkedIn (weekly deep scan)"
    engine: linkedin
    enabled: false   # demoted — daily linkedin_bridge.js already covers this source
    requires_auth: true
    url: "https://www.linkedin.com/jobs/search/?keywords=backend%20engineer%20intern&location=India"

