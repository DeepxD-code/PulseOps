[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseops-weekly-scan"
version = "0.1.0"
description = "Weekly Playwright portal scan."
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.1",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
