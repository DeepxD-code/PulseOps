[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseops-pulse-notify"
version = "0.1.0"
description = "Discord/Telegram alerts, IMAP watcher, replies."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.34.2",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
