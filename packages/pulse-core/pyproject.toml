[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseops-pulse-core"
version = "0.1.0"
description = "CV parsing, profile building, sourcing, resume building."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.14.3",
  "jinja2>=3.1.4",
  "lxml>=6.1.1",
  "playwright>=1.44.0",
  "pyyaml>=6.0.1",
  "requests>=2.34.2",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
