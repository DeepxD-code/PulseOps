name: PulseOps Email Watcher

# Runs every 30m — bounce auto-fix + platform job ingest
# See notifications/email_watcher.py

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no DB writes)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pulseops-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: pulseops-state
          path: .state
        continue-on-error: true
      - env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          mkdir -p data logs memory/cv_history output/pdf output/html output/prep config
          if [ -n "$STATE_KEY" ] && [ -f .state/pulseops.db.enc ]; then
            echo "$STATE_KEY" | openssl enc -d -aes-256-cbc -pbkdf2 -pass stdin -in .state/pulseops.db.enc -out ./pulseops.db \
              || echo "::warning::state decrypt failed — starting fresh"
          elif [ -f .state/pulseops.db ]; then
            cp .state/pulseops.db ./pulseops.db
          else
            echo "no DB"
          fi
          [ -d .state/logs ] && cp -r .state/logs/. ./logs/ || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: |
          pip install -r requirements.txt --break-system-packages
          for pkg in packages/*; do
            if [ -f "$pkg/pyproject.toml" ]; then pip install -e "$pkg" --break-system-packages; fi
          done
      - env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          IMAP_EMAIL: ${{ secrets.IMAP_EMAIL }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          {
            echo "SMTP_EMAIL=${SMTP_EMAIL:-}";
            echo "IMAP_EMAIL=${IMAP_EMAIL:-$SMTP_EMAIL}";
            echo "DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}";
          } > .env
          if [ -z "${SMTP_PASSWORD:-}" ]; then echo "::warning::SMTP_PASSWORD not set — sends will SKIP"; fi
      - run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python -m pulseops_notify.email_watcher $ARGS
      - if: always()
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          rm -rf .state
          mkdir -p .state/logs .state/data
          if [ -n "$STATE_KEY" ] && [ -f pulseops.db ]; then
            echo "$STATE_KEY" | openssl enc -aes-256-cbc -pbkdf2 -pass stdin -in pulseops.db -out .state/pulseops.db.enc \
              || cp pulseops.db .state/pulseops.db
          else
            cp pulseops.db .state/pulseops.db 2>/dev/null || true
          fi
          cp -r logs/. .state/logs/ 2>/dev/null || true
          cd .state
          git init -q
          git checkout -B pulseops-state
          git config user.name "pulseops-bot"
          git config user.email "pulseops-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "watcher: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:pulseops-state --force-with-lease
