name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # tests/test_scan_url_validation.py shells out to node and imports
      # apps/weekly-scan/scan.mjs, which imports js-yaml. Without this the job
      # died with ERR_MODULE_NOT_FOUND while passing locally, where a
      # developer already has node_modules. Only js-yaml is needed here:
      # playwright is not exercised by any test.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save js-yaml@^4.1.0
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt
          for pkg in packages/* apps/daily-pipeline apps/weekly-scan apps/dashboard; do
            if [ -f "$pkg/pyproject.toml" ]; then python -m pip install -e "$pkg"; fi
          done
          python -m pytest tests -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
# 2026-10-08: node 20 -> 24.
      # The node suite passed 101/101 locally on node 24 while this job failed on
      # node 20, on the same commit. That divergence was tracked as unresolved for
      # ~10 red runs and turned out to be the whole cause: the captcha probe's
      # fail-closed path behaves differently under node 20's test runner, which
      # cancels sibling subtests when a parent throws, so one stub mismatch
      # surfaced as five unrelated failures.
      # Aligned to the version the suite is actually developed and verified on.
      # If node 20 must be supported, that is a deliberate decision to test
      # separately - not an accident of the runner picking the older LTS.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The guardrail suites import apply.mjs, which imports js-yaml. A comment
      # here used to claim they "import nothing from node_modules, so no install
      # step" - that was wrong, and it is why this job failed on every push
      # with ERR_MODULE_NOT_FOUND while passing locally.
      # js-yaml alone: playwright is never exercised by a test, and no browser
      # download is needed to run one.
      - run: npm install --no-save js-yaml@^4.1.0
      # `node --check` cannot see inside a String.raw template, so a broken
      # Python block is valid JavaScript and passes every node check - as does
      # the whole test suite, since the defect is invisible until the query
      # actually runs. This project already carried three bugs of that class (a
      # dropped LIMIT, a mis-indented elif chain, a stale max_tokens) and two
      # more arrived today, every one surfacing only as "queue is empty".
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard the node runner cannot perform
        run: python tests/check_embedded_python.py
      - run: node --test tests/*.test.mjs

