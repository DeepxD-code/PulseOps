name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # tests/test_scan_url_validation.py shells out to node and imports
      # apps/weekly-scan/scan.mjs, which imports js-yaml. Without this the job
      # died with ERR_MODULE_NOT_FOUND while passing locally, where a
      # developer already has node_modules. Only js-yaml is needed here:
      # playwright is not exercised by any test.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save js-yaml@^4.1.0
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt
          for pkg in packages/* apps/daily-pipeline apps/weekly-scan apps/dashboard; do
            if [ -f "$pkg/pyproject.toml" ]; then python -m pip install -e "$pkg"; fi
          done
          python -m pytest tests -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The guardrail suites under tests/*.test.mjs run on the built-in node
      # test runner and import nothing from node_modules, so no install step.
      - run: node --test tests/*.test.mjs

